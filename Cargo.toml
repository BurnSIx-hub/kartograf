[package]
name = "kartograf"
version = "0.2.15"
edition = "2024"
description = "Редактор карт для настольных игр: пол, стены, объекты, выгрузка в VTT"

[dependencies]
base64 = "0.22.1"
flate2 = "1.1.10"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
roxmltree = "0.20"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Только программа (exe): сжатие WebP через libwebp, сеть для обновлений, системные окна файлов.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webp = "0.3"
ureq = "3"
rfd = "0.17.2"

# Только модуль Foundry (WebAssembly).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
web-time = "1.1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
