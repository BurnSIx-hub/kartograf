[package]
name = "kartograf"
version = "0.2.9"
edition = "2024"
description = "Редактор карт для настольных игр: пол, стены, объекты, выгрузка в VTT"

[dependencies]
base64 = "0.22.1"
flate2 = "1.1.10"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
webp = "0.3"
ureq = "3"
sha2 = "0.10"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
